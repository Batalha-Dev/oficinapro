name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # limites exigidos pelas diretrizes
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina_dev_2026
          POSTGRES_DB: oficina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oficina"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oficina:oficina_dev_2026@localhost:5432/oficina_test?schema=public
      DATABASE_URL_TEST: postgresql://oficina:oficina_dev_2026@localhost:5432/oficina_test?schema=public
      JWT_SECRET: segredo-somente-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Lint e formatação
        run: npm run lint && npm run format:check
      - name: Testes do backend
        run: npm test --prefix backend
      - name: Testes do frontend
        run: npm test --prefix frontend
      - name: Build do frontend
        run: npm run build --prefix frontend
